# YALNIZCA GELISTIRME. Kimlik dogrulama + cihaz basina ACL + TLS (docs/IOT.md).
# Kimlikler `pnpm mqtt:credentials`, sertifikalar `pnpm mqtt:certs` ile uretilir (ikisi de git disi).
# 1883 duz MQTT yalniz host'un 127.0.0.1'ine acilir (backend); cihazlar 8883 TLS kullanir.
persistence true
persistence_location /mosquitto/data/

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2

listener 9001
protocol websockets
