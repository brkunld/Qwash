# YALNIZCA GELISTIRME. Kimlik dogrulama + cihaz basina ACL acik; TLS sonraki adim (docs/IOT.md).
# Kimlik dosyalari `pnpm mqtt:credentials` ile .env'den uretilir (passwd commit edilmez).
persistence true
persistence_location /mosquitto/data/

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 1883
protocol mqtt

listener 9001
protocol websockets
