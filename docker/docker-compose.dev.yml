# QWASH yerel gelistirme altyapisi.
# Portlar yalnizca 127.0.0.1'e baglanir; disaridan erisilemez.
# Varsayilan portlar standart portlardan farklidir (5432/6379/1883 cogu makinede
# baska projeler veya yerel servisler tarafindan kullaniliyor). Degistirmek icin .env.
# Kullanim: pnpm infra:up  (kok dizinden calisir, kok .env dosyasini okur)
name: qwash-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qwash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-qwash_dev}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '127.0.0.1:${MQTT_HOST_PORT:-11883}:1883' # Duz MQTT, yalniz yerel (backend, araclar)
      - '${MQTT_BIND:-127.0.0.1}:${MQTT_TLS_HOST_PORT:-18883}:8883' # MQTT TLS (ESP32 icin .env'de MQTT_BIND=0.0.0.0)
      - '127.0.0.1:${MQTT_WS_HOST_PORT:-19001}:9001' # MQTT over WebSocket
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro # pnpm mqtt:credentials
      - ./docker/mosquitto/certs/ca.crt:/mosquitto/config/certs/ca.crt:ro # pnpm mqtt:certs (ca.key broker'a girmez)
      - ./docker/mosquitto/certs/server.crt:/mosquitto/config/certs/server.crt:ro
      - ./docker/mosquitto/certs/server.key:/mosquitto/config/certs/server.key:ro
      - mosquitto-data:/mosquitto/data
    environment:
      MQTT_HEALTH_PASSWORD: ${MQTT_HEALTH_PASSWORD:?pnpm mqtt:credentials oncesi .env'de tanimla}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mosquitto_sub -u qwash-health -P "$$MQTT_HEALTH_PASSWORD" -t \$$SYS/broker/uptime -C 1 -W 3',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  mosquitto-data:
