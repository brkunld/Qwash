<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESP32 Peron Simülatörü</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <style>
      :root {
        --bg: #0a0c10;
        --surface: #111520;
        --surface2: #181d2a;
        --border: #1f2940;
        --border2: #2a3555;
        --accent: #3b82f6;
        --accent2: #60a5fa;
        --green: #10b981;
        --yellow: #f59e0b;
        --red: #ef4444;
        --orange: #f97316;
        --cyan: #22d3ee;
        --muted: #4a5578;
        --text: #e2e8f0;
        --text2: #94a3b8;
        --font-mono: "Space Mono", monospace;
        --font-ui: "Syne", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-ui);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 32px 20px;
        background-image:
          radial-gradient(
            ellipse 60% 40% at 10% 0%,
            rgba(59, 130, 246, 0.07) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 40% 50% at 90% 100%,
            rgba(16, 185, 129, 0.05) 0%,
            transparent 70%
          );
      }

      .app {
        width: 100%;
        max-width: 1120px;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 20px;
        align-items: start;
      }

      /* ─── DEVICE COLUMN ─────────────────────────────── */
      .device-col {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .device-card {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 20px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .device-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.04) 0%,
          transparent 60%
        );
        pointer-events: none;
      }

      .device-label {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.15em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .device-label::before {
        content: "";
        width: 6px;
        height: 6px;
        background: var(--accent);
        border-radius: 50%;
        box-shadow: 0 0 8px var(--accent);
      }

      /* Screen */
      .screen-bezel {
        background: #06080f;
        border-radius: 14px;
        padding: 10px;
        border: 1px solid #1a2035;
        box-shadow:
          inset 0 2px 8px rgba(0, 0, 0, 0.6),
          0 0 0 1px #0d1120;
      }

      .screen {
        width: 100%;
        aspect-ratio: 4/3;
        background: #000;
        border-radius: 8px;
        position: relative;
        overflow: hidden;
        min-height: 240px;
      }

      .screen-content {
        width: 100%;
        height: 100%;
        position: relative;
      }

      /* Screen states */
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        flex-direction: column;
        gap: 10px;
      }

      .big-text {
        font-family: var(--font-ui);
        font-size: 32px;
        font-weight: 800;
        line-height: 1.2;
      }
      .medium-text {
        font-family: var(--font-ui);
        font-size: 20px;
        font-weight: 700;
      }

      .timer {
        font-family: var(--font-mono);
        font-size: 56px;
        font-weight: 700;
        color: var(--yellow);
        letter-spacing: 0.04em;
        text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
      }

      .package-title {
        font-family: var(--font-ui);
        font-size: 26px;
        font-weight: 800;
        text-align: center;
        margin-top: 28px;
        letter-spacing: 0.05em;
      }

      .qr-wrap {
        background: white;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
      }

      .select-title {
        position: absolute;
        top: 16px;
        width: 100%;
        text-align: center;
        font-family: var(--font-ui);
        font-size: 15px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.85);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .touch-btn {
        position: absolute;
        top: 70px;
        width: 120px;
        height: 80px;
        border-radius: 10px;
        border: none;
        font-family: var(--font-ui);
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        letter-spacing: 0.08em;
        transition:
          filter 0.15s,
          transform 0.12s;
        text-transform: uppercase;
      }
      .touch-btn:hover:not(:disabled) {
        filter: brightness(1.18);
        transform: scale(1.04);
      }
      .touch-btn:active:not(:disabled) {
        transform: scale(0.97);
      }
      .touch-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .btn-water {
        left: 18px;
        background: #2563eb;
        color: white;
        box-shadow: 0 0 16px rgba(37, 99, 235, 0.4);
      }
      .btn-foam {
        left: 156px;
        background: var(--cyan);
        color: #0a0f1a;
        box-shadow: 0 0 16px rgba(34, 211, 238, 0.35);
      }

      .progress-bg {
        position: absolute;
        left: 18px;
        bottom: 16px;
        width: calc(100% - 36px);
        height: 5px;
        background: #1a1a1a;
        border-radius: 999px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--cyan));
        width: 100%;
        transition: width 0.15s linear;
        border-radius: 999px;
      }

      /* Hardware row */
      .hardware-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }

      .physical-btn {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 12px;
        padding: 13px 12px;
        font-family: var(--font-ui);
        font-size: 13px;
        font-weight: 700;
        color: var(--cyan);
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .physical-btn:hover {
        background: rgba(34, 211, 238, 0.1);
        border-color: var(--cyan);
      }

      .buzzer {
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 13px 12px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        transition: all 0.15s;
      }
      .buzzer::before {
        content: "◉";
        font-size: 14px;
      }
      .buzzer.active {
        background: rgba(245, 158, 11, 0.15);
        border-color: var(--yellow);
        color: var(--yellow);
        animation: buzzer-pulse 0.25s infinite alternate;
      }
      .buzzer.active::before {
        color: var(--yellow);
      }
      @keyframes buzzer-pulse {
        from {
          box-shadow: none;
        }
        to {
          box-shadow: 0 0 14px rgba(245, 158, 11, 0.35);
        }
      }

      /* ─── PANEL COLUMN ──────────────────────────────── */
      .panel {
        background: var(--surface);
        border: 1px solid var(--border2);
        border-radius: 20px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        position: relative;
        overflow: hidden;
      }
      .panel::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        width: 200px;
        height: 200px;
        background: radial-gradient(
          circle,
          rgba(59, 130, 246, 0.06) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .panel-eyebrow {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.18em;
        color: var(--accent2);
        text-transform: uppercase;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panel-eyebrow::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--border2), transparent);
      }
      .panel h1 {
        font-size: 22px;
        font-weight: 800;
        color: var(--text);
        letter-spacing: -0.01em;
      }

      .fields-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 12px;
      }
      .field-group {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field-group label {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .field-group input,
      .field-group select {
        background: var(--surface2);
        border: 1px solid var(--border2);
        border-radius: 10px;
        padding: 10px 12px;
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text);
        width: 100%;
        transition: border-color 0.15s;
        outline: none;
      }
      .field-group input:focus,
      .field-group select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.15);
      }
      .field-group input[readonly] {
        color: var(--text2);
        cursor: default;
      }
      .field-group select option {
        background: var(--surface2);
      }

      /* Buttons */
      .btn {
        border: none;
        border-radius: 10px;
        padding: 11px 16px;
        font-family: var(--font-ui);
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .btn:hover {
        filter: brightness(1.12);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }

      .btn-connect {
        background: linear-gradient(135deg, #1d4ed8, var(--accent));
        color: white;
        width: 100%;
        padding: 13px;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.25);
      }

      .btn-green {
        background: rgba(16, 185, 129, 0.15);
        color: var(--green);
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .btn-blue {
        background: rgba(59, 130, 246, 0.12);
        color: var(--accent2);
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
      .btn-slate {
        background: var(--surface2);
        color: var(--text2);
        border: 1px solid var(--border2);
      }
      .btn-red {
        background: rgba(239, 68, 68, 0.12);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
      }

      .btn-green:hover {
        background: rgba(16, 185, 129, 0.25);
      }
      .btn-blue:hover {
        background: rgba(59, 130, 246, 0.22);
      }
      .btn-slate:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .btn-red:hover {
        background: rgba(239, 68, 68, 0.22);
      }

      /* Status / control section */
      .section-label {
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.14em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .actions-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .divider {
        height: 1px;
        background: var(--border);
      }

      /* Info box */
      .info-box {
        background: rgba(59, 130, 246, 0.06);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 12px;
        padding: 12px 14px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text2);
        line-height: 1.6;
      }
      .info-box b {
        color: var(--accent2);
        font-weight: 400;
      }

      .log {
        height: 160px;
        overflow-y: auto;
        background: #05070d;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: #6b7fa3;
        white-space: pre-wrap;
        line-height: 1.7;
        scroll-behavior: smooth;
      }
      .log::-webkit-scrollbar {
        width: 4px;
      }
      .log::-webkit-scrollbar-track {
        background: transparent;
      }
      .log::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 999px;
      }

      /* Connection state badge */
      .conn-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-mono);
        font-size: 11px;
        padding: 5px 10px;
        border-radius: 999px;
        background: var(--surface2);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .conn-badge.ok {
        color: var(--green);
        border-color: rgba(16, 185, 129, 0.4);
        background: rgba(16, 185, 129, 0.08);
      }
      .conn-badge.err {
        color: #f87171;
        border-color: rgba(239, 68, 68, 0.3);
        background: rgba(239, 68, 68, 0.07);
      }
      .conn-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .conn-badge.ok .conn-dot {
        box-shadow: 0 0 6px currentColor;
        animation: blink 2s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      @media (max-width: 860px) {
        .app {
          grid-template-columns: 1fr;
        }
        .device-col {
          max-width: 420px;
          margin: auto;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ── DEVICE ── -->
      <div class="device-col">
        <div class="device-card">
          <div class="device-label">ESP32 · TFT Display · 320×240</div>
          <div class="screen-bezel">
            <div class="screen">
              <div id="screen" class="screen-content"></div>
            </div>
          </div>
          <div class="hardware-row">
            <button class="physical-btn" onclick="physicalFoamButton()">
              ⬛ Fiziksel Köpük Btn
            </button>
            <div id="buzzer" class="buzzer">BUZZER: PASİF</div>
          </div>
        </div>
      </div>

      <!-- ── PANEL ── -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-eyebrow">Firebase Realtime · HTML Simülatör</div>
          <h1>ESP32 Peron Simülatörü</h1>
        </div>

        <!-- Connection -->
        <div class="connect-section">
          <div class="section-label">Bağlantı</div>
          <div class="fields-grid">
            <div class="field-group">
              <label>Email</label>
              <input id="email" type="email" placeholder="firebase@email.com" />
            </div>
            <div class="field-group">
              <label>Şifre</label>
              <input id="password" type="password" placeholder="••••••••" />
            </div>
            <div class="field-group">
              <label>Bay ID</label>
              <input id="bayId" value="bay_42060_01_02" />
            </div>
            <div class="field-group">
              <label>Durum</label>
              <input id="connectionState" value="Bağlı değil" readonly />
            </div>
          </div>
          <button class="btn btn-connect" onclick="connectFirebase()">
            Firebase'e Bağlan
          </button>
        </div>

        <div class="divider"></div>

        <!-- Control -->
        <div>
          <div class="section-label">Kontrol</div>
          <div class="fields-grid" style="margin-bottom: 12px">
            <div class="field-group">
              <label>Durum</label>
              <select id="status" onchange="writeStatus(this.value)">
                <option value="baslangic">baslangic</option>
                <option value="available">available</option>
                <option value="waiting">waiting</option>
                <option value="busy">busy</option>
                <option value="maintenance">maintenance</option>
                <option value="offline">offline</option>
              </select>
            </div>
            <div class="field-group">
              <label>Aktif mi?</label>
              <select
                id="isActive"
                onchange="writeActive(this.value === 'true')"
              >
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </div>
          </div>
          <div class="actions-grid">
            <button class="btn btn-green" onclick="writeStatus('available')">
              ⬛ QR Göster
            </button>
            <button class="btn btn-blue" onclick="writeStatus('waiting')">
              ⬛ Paket Seçimi
            </button>
            <button class="btn btn-slate" onclick="writeStatus('maintenance')">
              ⬛ Bakım Modu
            </button>
            <button class="btn btn-red" onclick="writeStatus('offline')">
              ⬛ Peronu Kapat
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="info-box">
          Gerçek Firebase Realtime Database bağlantısı · Okunan/yazılan yol:
          <b>/bays/&lt;bayId&gt;</b> · Kimlik bilgileri yalnızca tarayıcıda
          tutulur.
        </div>

        <!-- Log -->
        <div class="log-wrap">
          <div class="section-label">Seri Monitör</div>
          <div id="log" class="log"></div>
        </div>
      </div>
    </div>

    <script src="./secrets.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
      import {
        getDatabase,
        ref,
        onValue,
        set,
        update,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

      const defaultSecrets = window.SECRETS || {};

      const firebaseConfig = {
        apiKey: defaultSecrets.API_KEY || "",
        databaseURL: defaultSecrets.DATABASE_URL || "",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getDatabase(app);

      let bayRef = null,
        unsubscribeBay = null,
        connected = false;
      let currentStatus = "baslangic",
        isBayActive = true;
      let requestedPackage = "wash",
        durationSec = 60;
      let bitisZamaniMs = 0,
        dokunmatikKilit = false;
      let beklemeBaslangicMs = 0,
        BEKLEME_SURESI_MS = 60000;
      let waitingTimeoutHandled = false,
        sonNabizZamani = 0;
      const nabizAraligi = 30000;
      let audioCtx = null,
        lastShownSecond = -1,
        lastHalfSecondBeep = 0;
      let finishPlayed = false;
      let lastRenderedStatus = null,
        lastRenderedActive = null;
      let lastRenderedPackage = null,
        lastRenderedDuration = null;

      const screen = document.getElementById("screen");
      const logBox = document.getElementById("log");
      const buzzerEl = document.getElementById("buzzer");

      const nowMs = () => Date.now();

      function log(msg) {
        const time = new Date().toLocaleTimeString("tr-TR");
        logBox.textContent += `[${time}] ${msg}\n`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      function setScreen(html, bg = "#000") {
        screen.style.background = bg;
        screen.innerHTML = html;
      }

      function setConnectionState(text, ok = false) {
        const el = document.getElementById("connectionState");
        el.value = text;
      }

      function beep(freq = 2000, duration = 100) {
        try {
          if (!audioCtx)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.value = freq;
          gain.gain.value = 0.08;
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          setTimeout(() => osc.stop(), duration);
        } catch (e) {}
        buzzerEl.classList.add("active");
        buzzerEl.textContent = `BUZZER: ${freq}Hz`;
        setTimeout(
          () => {
            buzzerEl.classList.remove("active");
            buzzerEl.textContent = "BUZZER: PASİF";
          },
          Math.min(duration, 600),
        );
      }

      function showBaslangic() {
        setScreen(`
          <div class="center">
            <div class="medium-text" style="color:#4a5578">Firebase Bağlantısı</div>
            <div class="medium-text" style="color:#4a5578">Bekleniyor...</div>
            <div style="margin-top:12px;font-family:'Space Mono',monospace;font-size:11px;color:#2a3555">Sağ panelden giriş yap</div>
          </div>`);
      }

      function drawQR() {
        const bayId =
          document.getElementById("bayId").value.trim() || "bay_42060_01_02";
        setScreen(
          `
          <div class="qr-wrap">
            <canvas id="qrCanvas" width="200" height="200"></canvas>
            <div style="color:#111;font-family:'Space Mono',monospace;font-size:11px;margin-top:4px">${bayId}</div>
          </div>`,
          "white",
        );
        const canvas = document.getElementById("qrCanvas");
        if (window.QRCode && typeof window.QRCode.toCanvas === "function") {
          window.QRCode.toCanvas(
            canvas,
            bayId,
            {
              width: 200,
              margin: 1,
              color: { dark: "#000000", light: "#ffffff" },
            },
            (err) => {
              if (err) {
                log("❌ QR çizim hatası: " + err.message);
                showQrFallback(bayId);
              } else log(`QR çizildi: ${bayId}`);
            },
          );
        } else {
          showQrFallback(bayId);
        }
      }

      function showQrFallback(bayId) {
        const url =
          "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" +
          encodeURIComponent(bayId);
        setScreen(
          `<div class="qr-wrap"><img src="${url}" width="200" height="200" /><div style="color:#111;font-size:11px;font-family:monospace">${bayId}</div></div>`,
          "white",
        );
      }

      function ekranaKapaliYaz() {
        setScreen(
          `<div class="center"><div class="big-text" style="color:#ef4444">BU PERON</div><div class="big-text" style="color:#ef4444">KAPALIDIR</div></div>`,
        );
        log("DURUM: PERON KAPALI");
      }

      function showMaintenance() {
        setScreen(
          `<div class="center"><div class="big-text" style="color:#f97316">BAKIM MODU</div></div>`,
        );
        log("DURUM: BAKIM MODU");
      }

      function showWaiting() {
        dokunmatikKilit = false;
        waitingTimeoutHandled = false;
        beklemeBaslangicMs = nowMs();
        BEKLEME_SURESI_MS = 60000;
        setScreen(`
          <div class="select-title">Lütfen Paket Seçiniz</div>
          <button class="touch-btn btn-water" onclick="selectPackage('wash')">SU</button>
          <button class="touch-btn btn-foam"  onclick="selectPackage('foam')">KÖPÜK</button>
          <div class="progress-bg"><div id="progressFill" class="progress-fill"></div></div>`);
        log("DURUM: waiting / Paket seçimi bekleniyor");
      }

      function showBusy() {
        durationSec = durationSec || 60;
        requestedPackage = requestedPackage || "wash";
        bitisZamaniMs = nowMs() + durationSec * 1000;
        lastShownSecond = -1;
        finishPlayed = false;
        const color = requestedPackage === "foam" ? "#22d3ee" : "#3b82f6";
        const title = requestedPackage === "foam" ? "KÖPÜK MODU" : "SU MODU";
        setScreen(`
          <div class="package-title" style="color:${color}">${title}</div>
          <div id="timer" class="timer" style="text-align:center">00:00</div>`);
        log(`DURUM: busy / ${requestedPackage} / ${durationSec} sn`);
      }

      function applyStatusChange(force = false) {
        const shouldRender =
          force ||
          lastRenderedStatus !== currentStatus ||
          lastRenderedActive !== isBayActive ||
          lastRenderedPackage !== requestedPackage ||
          lastRenderedDuration !== durationSec;
        if (!shouldRender) return;
        lastRenderedStatus = currentStatus;
        lastRenderedActive = isBayActive;
        lastRenderedPackage = requestedPackage;
        lastRenderedDuration = durationSec;
        if (!isBayActive || currentStatus === "offline")
          return ekranaKapaliYaz();
        if (currentStatus === "available") drawQR();
        else if (currentStatus === "waiting") showWaiting();
        else if (currentStatus === "busy") showBusy();
        else if (currentStatus === "maintenance") showMaintenance();
        else showBaslangic();
      }

      function syncPanelFromData(data) {
        if (!data) return;
        const oldStatus = currentStatus,
          oldActive = isBayActive;
        const oldPackage = requestedPackage,
          oldDuration = durationSec;
        if (typeof data.status === "string") currentStatus = data.status;
        if (typeof data.isActive === "boolean") isBayActive = data.isActive;
        if (typeof data.requestedPackage === "string")
          requestedPackage = data.requestedPackage;
        if (typeof data.durationSec === "number")
          durationSec = data.durationSec;
        data.__meaningfulChanged =
          oldStatus !== currentStatus ||
          oldActive !== isBayActive ||
          oldPackage !== requestedPackage ||
          oldDuration !== durationSec;
        document.getElementById("status").value = currentStatus;
        document.getElementById("isActive").value = String(isBayActive);
      }

      async function connectFirebase() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const bayId =
          document.getElementById("bayId").value.trim() || "bay_42060_01_02";
        if (!email || !password) {
          log("❌ Email ve şifre gerekli.");
          return;
        }
        try {
          setConnectionState("Bağlanıyor...", false);
          await signInWithEmailAndPassword(auth, email, password);
          connected = true;
          bayRef = ref(db, `/bays/${bayId}`);
          if (unsubscribeBay) unsubscribeBay();
          unsubscribeBay = onValue(
            bayRef,
            (snapshot) => {
              const data = snapshot.val();
              log("Firebase stream: " + JSON.stringify(data));
              const liveData = data || {};
              syncPanelFromData(liveData);
              if (liveData.__meaningfulChanged) applyStatusChange();
            },
            (err) => {
              log("❌ Stream hatası: " + err.message);
            },
          );
          await update(bayRef, { lastSeen: serverTimestamp() });
          setConnectionState("Bağlandı", true);
          log("✅ Firebase bağlandı: /bays/" + bayId);
        } catch (err) {
          connected = false;
          setConnectionState("Bağlantı hatası", false);
          log("❌ Firebase bağlantı hatası: " + err.message);
        }
      }

      async function writeBayPatch(patch) {
        if (!connected || !bayRef) {
          log("❌ Önce Firebase'e bağlan.");
          return;
        }
        try {
          await update(bayRef, { ...patch, updatedAt: serverTimestamp() });
        } catch (err) {
          log("❌ Yazma hatası: " + err.message);
        }
      }

      async function writeStatus(status) {
        currentStatus = status;
        document.getElementById("status").value = status;
        await writeBayPatch({ status });
        applyStatusChange();
      }

      async function writeActive(active) {
        isBayActive = active;
        document.getElementById("isActive").value = String(active);
        await writeBayPatch({ isActive: active });
        applyStatusChange();
      }

      async function selectPackage(pkg) {
        if (currentStatus !== "waiting" || dokunmatikKilit) return;
        dokunmatikKilit = true;
        requestedPackage = pkg;
        setScreen(
          `<div class="center medium-text" style="color:#f59e0b">İstek iletiliyor...</div>`,
        );
        log(`hardwareSelection gönderiliyor: ${pkg}`);
        await writeBayPatch({ hardwareSelection: pkg });
        setTimeout(
          () =>
            setScreen(
              `<div class="center medium-text" style="color:#94a3b8">Ödeme bekleniyor...</div>`,
            ),
          400,
        );
      }

      function physicalFoamButton() {
        log("Fiziksel KÖPÜK butonuna basıldı");
        selectPackage("foam");
      }

      function updateWaitingProgress() {
        if (currentStatus !== "waiting" || dokunmatikKilit) return;
        const elapsed = nowMs() - beklemeBaslangicMs;
        const ratio = Math.max(0, 1 - elapsed / BEKLEME_SURESI_MS);
        const fill = document.getElementById("progressFill");
        if (fill) fill.style.width = `${ratio * 100}%`;
        if (elapsed >= BEKLEME_SURESI_MS && !waitingTimeoutHandled) {
          waitingTimeoutHandled = true;
          dokunmatikKilit = true;
          log("Bekleme süresi bitti. Durum available yapılıyor...");
          writeBayPatch({ status: "available", hardwareSelection: null });
        }
      }

      function updateBusyTimer() {
        if (currentStatus !== "busy") return;
        const timer = document.getElementById("timer");
        if (!timer) return;
        const kalanMs = bitisZamaniMs - nowMs();
        if (kalanMs > 0) {
          const toplamSaniye = Math.floor(kalanMs / 1000);
          const saniye = toplamSaniye % 60;
          const dakika = Math.floor(toplamSaniye / 60);
          timer.textContent = `${String(dakika).padStart(2, "0")}:${String(saniye).padStart(2, "0")}`;
          if (toplamSaniye >= 10) {
            if (toplamSaniye !== lastShownSecond) beep(2000, 100);
          } else if (nowMs() - lastHalfSecondBeep >= 500) {
            beep(2500, 100);
            lastHalfSecondBeep = nowMs();
          }
          lastShownSecond = toplamSaniye;
          finishPlayed = false;
        } else if (!finishPlayed) {
          setScreen(
            `<div class="center big-text" style="color:#ef4444">İŞLEM BİTTİ</div>`,
          );
          beep(1000, 3000);
          log("İŞLEM BİTTİ");
          finishPlayed = true;
        }
      }

      async function nabizGonder() {
        if (!connected || !bayRef) return;
        try {
          await update(bayRef, { lastSeen: serverTimestamp() });
          log("💓 Nabız gönderildi");
        } catch (err) {
          log("❌ Nabız gönderilemedi: " + err.message);
        }
      }

      function tick() {
        updateWaitingProgress();
        updateBusyTimer();
        if (nowMs() - sonNabizZamani >= nabizAraligi) {
          sonNabizZamani = nowMs();
          nabizGonder();
        }
      }

      window.connectFirebase = connectFirebase;
      window.writeStatus = writeStatus;
      window.writeActive = writeActive;
      window.selectPackage = selectPackage;
      window.physicalFoamButton = physicalFoamButton;

      function fillInputsFromSecrets() {
        if (!window.SECRETS) return;

        if (window.SECRETS.USER_EMAIL)
          document.getElementById("email").value = window.SECRETS.USER_EMAIL;

        if (window.SECRETS.USER_PASSWORD)
          document.getElementById("password").value =
            window.SECRETS.USER_PASSWORD;

        if (window.SECRETS.BAY_ID)
          document.getElementById("bayId").value = window.SECRETS.BAY_ID;
      }

      fillInputsFromSecrets();
      showBaslangic();
      setInterval(tick, 120);
    </script>
  </body>
</html>
