# PRODUCTION broker. Kimlik + cihaz basina ACL + TLS (docs/IOT.md).
# passwd, acl ve sertifikalar deploy/secrets/mqtt/ altindadir (git disi).
persistence true
persistence_location /mosquitto/data/

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Duz MQTT: yalniz docker ic agi (backend, saglik kontrolu). Port host'a acilmaz.
listener 1883
protocol mqtt

# Cihazlar: TLS. Sertifika firmware'deki ozel CA ile imzali, SAN = CUSTOMER_HOST.
listener 8883
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2
