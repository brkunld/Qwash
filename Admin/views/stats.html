<div class="sec-header">
  <div class="sec-title">Genel İstatistikler</div>
</div>
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">Toplam Peron</div>
    <div class="stat-value blue" id="stat-total-bays">0</div>
    <div class="stat-sub">Sisteme kayıtlı donanım</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Aktif Peron</div>
    <div class="stat-value green" id="stat-active-bays">0</div>
    <div class="stat-sub">Müşteri kullanımına açık</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Boş Peron</div>
    <div class="stat-value green" id="stat-available-bays">0</div>
    <div class="stat-sub">Şu anda uygun</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Çalışan Peron</div>
    <div class="stat-value amber" id="stat-busy-bays">0</div>
    <div class="stat-sub">Anlık yıkanan araç</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Bakımda</div>
    <div class="stat-value blue" id="stat-maint-bays">0</div>
    <div class="stat-sub">Manuel bakım modunda</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Kapalı</div>
    <div class="stat-value red" id="stat-offline-bays">0</div>
    <div class="stat-sub">Devre dışı bırakılmış</div>
  </div>
</div>

<div class="stats-panel">
  <div class="sec-title" style="margin-bottom: 20px">Peron Durum Dağılımı</div>
  <div class="stat-bar-row">
    <div class="stat-bar-head">
      <span>Boş</span><span id="stat-bar-available-label">0%</span>
    </div>
    <div class="stat-bar">
      <div class="stat-bar-fill green" id="stat-bar-available" style="width: 0%"></div>
    </div>
  </div>
  <div class="stat-bar-row">
    <div class="stat-bar-head">
      <span>Dolu</span><span id="stat-bar-busy-label">0%</span>
    </div>
    <div class="stat-bar">
      <div class="stat-bar-fill amber" id="stat-bar-busy" style="width: 0%"></div>
    </div>
  </div>
  <div class="stat-bar-row">
    <div class="stat-bar-head">
      <span>Bakım / Kapalı</span><span id="stat-bar-offline-label">0%</span>
    </div>
    <div class="stat-bar">
      <div class="stat-bar-fill red" id="stat-bar-offline" style="width: 0%"></div>
    </div>
  </div>
</div>
