<div class="search-wrap">
  <div class="sec-title">Kullanıcı Ara ve Yönet</div>
  <div class="search-row">
    <input class="inp" type="text" id="searchInput" placeholder="E-Posta, telefon veya UID..." />
    <button class="btn btn-accent" onclick="doSearch()" id="search-btn">Bul</button>
  </div>
</div>
<div id="userCard" style="display: none">
  <div class="user-card">
    <div class="uc-banner">
      <div class="uc-ava" id="uc-ava-icon">?</div>
      <div>
        <div class="uc-name">
          <span id="res-name">-</span>
          <span id="res-blocked-badge" class="badge-blocked" style="display: none">ENGELLİ</span>
        </div>
        <div class="uc-email" id="res-email">-</div>
      </div>
      <div class="uc-tokens">
        <div class="uc-tok-num" id="res-tokens">0</div>
        <div class="uc-tok-label">MEVCUT JETON</div>
      </div>
    </div>
    <div class="uc-body">
      <div class="uc-fields">
        <div class="uc-field">
          <div class="uf-label">Telefon Numarası</div>
          <div class="uf-val" id="res-phone">-</div>
        </div>
        <div class="uc-field">
          <div class="uf-label">Sistem ID</div>
          <div class="uf-val" id="res-uid" style="font-family: monospace; font-size: 13px">-</div>
        </div>
      </div>
      <div class="topup-row">
        <span style="font-size: 14px; font-weight: 600">Manuel Jeton Yükle:</span>
        <input class="inp" type="number" id="tokenAmt" placeholder="Miktar (Örn: 5)" style="width: 140px; flex: none" />
        <button class="btn-sm-accent" id="add-token-btn">Jeton Ekle</button>
      </div>
      <div class="topup-row" style="margin-top: 16px">
        <button class="btn-sm-accent btn-danger" id="block-user-btn" onclick="toggleUserBlock()">
          Kullanıcıyı Sistemden Engelle
        </button>
      </div>
    </div>
  </div>
</div>
